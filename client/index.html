<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#294936" />
    <meta name="description" content="Shop farm-sourced cashews, dry fruits, millets, natural groceries and traditional mitti cookware from Samruddhi." />
    <title>Samruddhi | From Farm to Kitchen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
    <script>
      window.addEventListener("error", function (event) {
        var root = document.getElementById("root");
        if (!root) return;
        root.innerHTML = '<main style="min-height:100vh;padding:32px;font-family:sans-serif;background:#fbf7ed;color:#1f2d24"><h1>Samruddhi could not load.</h1><pre style="white-space:pre-wrap">' + event.message + '</pre></main>';
      });
      window.addEventListener("unhandledrejection", function (event) {
        var root = document.getElementById("root");
        if (!root) return;
        root.innerHTML = '<main style="min-height:100vh;padding:32px;font-family:sans-serif;background:#fbf7ed;color:#1f2d24"><h1>Samruddhi could not load.</h1><pre style="white-space:pre-wrap">' + (event.reason && event.reason.message ? event.reason.message : event.reason) + '</pre></main>';
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
